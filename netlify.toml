# Byggeoppsett for Netlify.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Stanford Inc ble flyttet fra artikler til bokanmeldelser.
[[redirects]]
  from = "/artikler/stanford-inc/"
  to = "/anmeldelser/stanford-inc/"
  status = 301

[[redirects]]
  from = "/artikler/datakraft-vs-dommekraft/"
  to = "/anmeldelser/datakraft-vs-dommekraft/"
  status = 301
